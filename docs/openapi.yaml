openapi: 3.0.3
info:
  title: Enterprise Intelligence Platform API
  version: 1.3.0
  description: |
    RAG + agent platform. LLMs via Groq (openai/gpt-oss-120b primary; gpt-oss-20b and qwen fallbacks).

    **Authentication**
    - Browsers: login sets an HttpOnly `eip_session` cookie plus a readable `eip_csrf` cookie.
      Every POST/DELETE must send header `X-CSRF-Token` equal to the `eip_csrf` cookie.
    - API clients: send `"return_token": true` to /auth/login and use `Authorization: Bearer <token>` (no CSRF needed).

    **Limits** (per user, configurable): chat requests per minute/day, daily token budget, uploads per hour,
    document count and storage quota. Exceeding a limit returns 429 with `Retry-After`.
servers: [{ url: / }]
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
    cookie: { type: apiKey, in: cookie, name: eip_session }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
        error_ref: { type: string, description: reference id to find the full error in server logs }
        retry_after: { type: integer }
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string, minLength: 8, description: "8-128 chars, letters and numbers" }
        name: { type: string }
        invite_code: { type: string, description: required when REGISTRATION_INVITE_CODE is set }
        return_token: { type: boolean, description: return the JWT in the body (API clients only) }
    Source:
      type: object
      properties:
        source_id: { type: string, example: S1 }
        document_id: { type: integer }
        filename: { type: string }
        page: { type: integer, nullable: true }
        snippet: { type: string }
        vector_score: { type: number }
        bm25_score: { type: number }
        fused_score: { type: number }
        suspicious: { type: boolean }
        injection_reasons: { type: string }
    ChatRequest:
      type: object
      required: [message]
      properties:
        message: { type: string, maxLength: 4000 }
        mode: { type: string, enum: [rag, agent], default: rag }
        model: { type: string, description: "Optional preferred model id from GET /api/models" }
        conversation_id: { type: integer, nullable: true }
        document_ids: { type: array, items: { type: integer } }
        file_type: { type: string, enum: [pdf, txt, md, markdown, csv] }
    ChatResponse:
      type: object
      properties:
        conversation_id: { type: integer }
        mode: { type: string }
        status: { type: string, enum: [answered, insufficient, conflicting, completed, step_limit, failed] }
        answer: { type: string, description: Markdown with [S#] citations }
        citations: { type: array, items: { type: string } }
        sources: { type: array, items: { $ref: '#/components/schemas/Source' } }
        conflicts: { type: array, items: { type: object } }
        verification: { type: object }
        injection_warnings: { type: integer }
        steps: { type: array, items: { type: object } }
        report: { type: object }
        usage: { type: array, items: { type: object } }
        total_tokens: { type: integer }
        latency_ms: { type: integer }
security: [{ bearer: [] }, { cookie: [] }]
paths:
  /api/health:
    get: { security: [], summary: Health check, responses: { '200': { description: OK } } }
  /api/models:
    get: { summary: Configured models and availability for the key, responses: { '200': { description: OK } } }
  /api/auth/config:
    get: { security: [], summary: Whether registration is open / needs an invite code, responses: { '200': { description: OK } } }
  /api/auth/register:
    post:
      security: []
      summary: Register (rate limited per IP; may be disabled or invite-only)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses: { '201': { description: session cookies set }, '400': { description: validation }, '403': { description: disabled / bad invite }, '409': { description: exists }, '429': { description: throttled } }
  /api/auth/login:
    post:
      security: []
      summary: Login (IP throttling + per-account lockout)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Credentials' } } } }
      responses: { '200': { description: session cookies set }, '401': { description: invalid credentials }, '429': { description: locked / throttled } }
  /api/auth/logout:
    post: { summary: Revoke current session, responses: { '200': { description: OK } } }
  /api/auth/logout-all:
    post: { summary: Revoke all sessions of the user, responses: { '200': { description: OK } } }
  /api/auth/change-password:
    post:
      summary: Change password (revokes all sessions)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { current_password: { type: string }, new_password: { type: string } } } } } }
      responses: { '200': { description: OK }, '400': { description: weak password }, '403': { description: wrong current password } }
  /api/auth/me:
    get: { summary: Current user, responses: { '200': { description: OK }, '401': { description: not logged in } } }
  /api/documents:
    get: { summary: List documents with processing status, responses: { '200': { description: OK } } }
    post:
      summary: Upload up to 20 PDF/TXT/MD/CSV files (validated, quota-checked, processed asynchronously)
      requestBody:
        content:
          multipart/form-data:
            schema: { type: object, properties: { files: { type: array, items: { type: string, format: binary } } } }
      responses: { '202': { description: queued }, '200': { description: all duplicate/rejected }, '429': { description: upload limit } }
  /api/documents/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { summary: Document detail, chunk preview (suspicious first) and jobs, responses: { '200': { description: OK }, '404': { description: not found } } }
    delete: { summary: Delete document and its vectors, responses: { '200': { description: deleted } } }
  /api/documents/{id}/reprocess:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    post: { summary: Re-queue processing (no duplicate jobs), responses: { '200': { description: OK } } }
  /api/conversations:
    get: { summary: List conversations, responses: { '200': { description: OK } } }
    post: { summary: Create conversation, responses: { '201': { description: created } } }
  /api/conversations/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: integer } }]
    get: { summary: Conversation with messages, responses: { '200': { description: OK } } }
    delete: { summary: Delete conversation, responses: { '200': { description: deleted } } }
  /api/chat:
    post:
      summary: Ask (RAG) or run the agent
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ChatRequest' } } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ChatResponse' } } } }
        '400': { description: validation (e.g. unknown model) }
        '429': { description: rate limit or daily token budget, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '503': { description: all LLM models failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /api/stats:
    get: { summary: Dashboard statistics and current usage vs limits, responses: { '200': { description: OK } } }
  /api/logs:
    get:
      summary: Activity log (incl. security events) + LLM call log
      parameters: [{ name: limit, in: query, schema: { type: integer, maximum: 200 } }]
      responses: { '200': { description: OK } }
  /api/agent/runs:
    get: { summary: Recent agent runs with step traces, responses: { '200': { description: OK } } }
